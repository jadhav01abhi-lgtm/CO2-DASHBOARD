<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HONEYWELL CO₂ MONITOR</title>
<style>
body { margin:0; font-family:Arial,Helvetica,sans-serif; background:#f3f6f9; color:#222; }
.header { background:#17202a; color:white; padding:25px; text-align:center; }
.header h1 { margin:0; font-size:28px; }
.header p { margin:8px 0 0; opacity:.8; }
.container { max-width:1100px; margin:auto; padding:20px; }
.cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:15px; }
.card { background:white; border-radius:12px; padding:20px; box-shadow:0 3px 10px rgba(0,0,0,.08); }
.card h3 { margin-top:0; font-size:15px; color:#666; }
.value { font-size:28px; font-weight:bold; }
.buttons { margin-top:20px; display:flex; gap:10px; flex-wrap:wrap; }
button { border:none; padding:12px 22px; border-radius:7px; color:white; font-size:15px; cursor:pointer; }
button:disabled { opacity:.6; cursor:wait; }
.start { background:#198754; }
.stop { background:#dc3545; }
.download { background:#0d6efd; }
.clear { background:#6c757d; }
.tablebox { margin-top:25px; background:white; border-radius:12px; padding:20px; box-shadow:0 3px 10px rgba(0,0,0,.08); overflow-x:auto; }
table { width:100%; border-collapse:collapse; }
th,td { padding:10px; border-bottom:1px solid #ddd; text-align:center; }
th { background:#f1f3f5; }
#message { margin-top:15px; min-height:20px; font-size:14px; font-weight:bold; }
</style>
</head>
<body>

<div class="header">
  <h1>HONEYWELL CO₂ MONITOR</h1>
  <p>Live from anywhere - powered by Firebase</p>
</div>

<div class="container">
  <div class="cards">
    <div class="card"><h3>Live CO₂</h3><div class="value"><span id="co2">---</span> ppm</div></div>
    <div class="card"><h3>Wi-Fi Signal</h3><div class="value"><span id="rssi">---</span> dBm</div></div>
    <div class="card"><h3>Date</h3><div class="value" id="date">---</div></div>
    <div class="card"><h3>Time</h3><div class="value" id="time">---</div></div>
    <div class="card"><h3>Recording</h3><div class="value" id="recording">---</div></div>
    <div class="card"><h3>Total Records</h3><div class="value" id="count">---</div></div>
  </div>

  <div class="buttons">
    <button class="start" onclick="sendCommand('start', this)">START</button>
    <button class="stop" onclick="sendCommand('stop', this)">STOP</button>
    <button class="download" onclick="downloadCSV()">DOWNLOAD (EXCEL/CSV)</button>
    <button class="clear" onclick="clearData(this)">CLEAR ALL DATA</button>
  </div>

  <div id="message"></div>

  <div class="tablebox">
    <h2>Stored Readings</h2>
    <table>
      <thead>
        <tr><th>No.</th><th>Date</th><th>Time</th><th>CO₂ (ppm)</th></tr>
      </thead>
      <tbody id="records"></tbody>
    </table>
  </div>
</div>

<script>
// =====================================================
//                 FIREBASE DATABASE URL
// =====================================================
const FIREBASE_URL = "https://co2-monitor-49cbd-default-rtdb.firebaseio.com/";

let currentRecords = [];

function showMessage(text) {
  document.getElementById("message").innerText = text;
}

// =====================================================
//                    LIVE DATA
// =====================================================
async function updateLive() {
  try {
    const response = await fetch(FIREBASE_URL + "live.json", { cache: "no-store" });

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const d = await response.json();

    if (!d) return;

    document.getElementById("co2").innerText = d.co2 ?? "---";
    document.getElementById("rssi").innerText = d.rssi ?? "---";
    document.getElementById("date").innerText = d.date ?? "---";
    document.getElementById("time").innerText = d.time ?? "---";
    document.getElementById("recording").innerText = d.recording ?? "---";
    document.getElementById("count").innerText = d.count ?? "---";
  }
  catch (err) {
    console.error("Live fetch failed:", err);
  }
}

// =====================================================
//                  LOAD FIREBASE RECORDS
// =====================================================
async function loadRecords() {
  try {
    const response = await fetch(FIREBASE_URL + "records.json", { cache: "no-store" });

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const data = await response.json();

    if (!data) {
      currentRecords = [];
      document.getElementById("records").innerHTML = "";
      return;
    }

    // New ESP32 records contain a numeric timestamp.
    // Fallback to date+time for older Firebase records.
    const rows = Object.values(data).sort((a, b) => {
      if (a.timestamp != null && b.timestamp != null) {
        return Number(b.timestamp) - Number(a.timestamp);
      }
      return ((String(b.date || "") + String(b.time || ""))
        .localeCompare(String(a.date || "") + String(a.time || "")));
    });

    currentRecords = rows;

    let html = "";

    rows.forEach((r, index) => {
      html += "<tr>";
      html += "<td>" + (index + 1) + "</td>";
      html += "<td>" + escapeHTML(r.date ?? "---") + "</td>";
      html += "<td>" + escapeHTML(r.time ?? "---") + "</td>";
      html += "<td>" + escapeHTML(r.ppm ?? "---") + "</td>";
      html += "</tr>";
    });

    document.getElementById("records").innerHTML = html;
  }
  catch (err) {
    console.error("Records fetch failed:", err);
  }
}

function escapeHTML(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

// =====================================================
//                  START / STOP COMMAND
// =====================================================
async function sendCommand(cmd, button) {
  if (button) button.disabled = true;

  try {
    const response = await fetch(FIREBASE_URL + "command.json", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(cmd)
    });

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    showMessage(cmd.toUpperCase() + " command sent.");
  }
  catch (err) {
    console.error("Command send failed:", err);
    showMessage("Command failed. Check Firebase rules.");
  }
  finally {
    if (button) button.disabled = false;
  }
}

// =====================================================
//                    DOWNLOAD CSV
// =====================================================
function downloadCSV() {
  if (!currentRecords || currentRecords.length === 0) {
    alert("No data to download yet.");
    return;
  }

  let csv = "No,Date,Time,CO2_ppm\n";

  currentRecords.forEach((r, index) => {
    const date = String(r.date ?? "").replaceAll('"', '""');
    const time = String(r.time ?? "").replaceAll('"', '""');
    const ppm = String(r.ppm ?? "").replaceAll('"', '""');

    csv += `${index + 1},"${date}","${time}","${ppm}"\n`;
  });

  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = "co2_readings_" +
                  new Date().toISOString().slice(0, 10) +
                  ".csv";

  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);

  URL.revokeObjectURL(url);
}

// =====================================================
//                     CLEAR DATA
// =====================================================
async function clearData(button) {
  if (!confirm("This will permanently delete all stored readings. Continue?")) {
    return;
  }

  if (button) button.disabled = true;

  try {
    // First tell ESP32 to clear its local EEPROM.
    const commandResponse = await fetch(FIREBASE_URL + "command.json", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify("clear")
    });

    if (!commandResponse.ok) {
      throw new Error("Could not send clear command");
    }

    // Then delete the cloud records.
    const deleteResponse = await fetch(FIREBASE_URL + "records.json", {
      method: "DELETE"
    });

    if (!deleteResponse.ok) {
      throw new Error("Could not delete Firebase records");
    }

    currentRecords = [];
    document.getElementById("records").innerHTML = "";

    showMessage("All records cleared.");
    await updateLive();
  }
  catch (err) {
    console.error("Clear failed:", err);
    showMessage("Clear failed. Check Firebase rules.");
  }
  finally {
    if (button) button.disabled = false;
  }
}

// =====================================================
//                    AUTO REFRESH
// =====================================================
setInterval(updateLive, 2000);
setInterval(loadRecords, 5000);

updateLive();
loadRecords();
</script>

</body>
</html>
