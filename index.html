<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HONEYWELL CO₂ MONITOR</title>
<style>
body { margin:0; font-family:Arial,Helvetica,sans-serif; background:#f3f6f9; color:#222; }
.header { background:#17202a; color:white; padding:25px; text-align:center; }
.header h1 { margin:0; font-size:28px; }
.header p { margin:8px 0 0; opacity:.8; }
.container { max-width:1100px; margin:auto; padding:20px; }
.cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:15px; }
.card { background:white; border-radius:12px; padding:20px; box-shadow:0 3px 10px rgba(0,0,0,.08); }
.card h3 { margin-top:0; font-size:15px; color:#666; }
.value { font-size:28px; font-weight:bold; }
.buttons { margin-top:20px; display:flex; gap:10px; flex-wrap:wrap; }
button { border:none; padding:12px 22px; border-radius:7px; color:white; font-size:15px; cursor:pointer; }
.start { background:#198754; }
.stop { background:#dc3545; }
.tablebox { margin-top:25px; background:white; border-radius:12px; padding:20px; box-shadow:0 3px 10px rgba(0,0,0,.08); overflow-x:auto; }
table { width:100%; border-collapse:collapse; }
th,td { padding:10px; border-bottom:1px solid #ddd; text-align:center; }
th { background:#f1f3f5; }
</style>
</head>
<body>

<div class="header">
  <h1>HONEYWELL CO₂ MONITOR</h1>
  <p>Live from anywhere - powered by Firebase</p>
</div>

<div class="container">
  <div class="cards">
    <div class="card"><h3>Live CO₂</h3><div class="value"><span id="co2">---</span> ppm</div></div>
    <div class="card"><h3>Wi-Fi Signal</h3><div class="value"><span id="rssi">---</span> dBm</div></div>
    <div class="card"><h3>Date</h3><div class="value" id="date">---</div></div>
    <div class="card"><h3>Time</h3><div class="value" id="time">---</div></div>
    <div class="card"><h3>Recording</h3><div class="value" id="recording">---</div></div>
    <div class="card"><h3>Total Records</h3><div class="value" id="count">---</div></div>
  </div>

  <div class="buttons">
    <button class="start" onclick="sendCommand('start')">START</button>
    <button class="stop" onclick="sendCommand('stop')">STOP</button>
  </div>

  <div class="tablebox">
    <h2>Stored Readings</h2>
    <table>
      <thead>
        <tr><th>No.</th><th>Date</th><th>Time</th><th>CO₂ (ppm)</th></tr>
      </thead>
      <tbody id="records"></tbody>
    </table>
  </div>
</div>

<script>
// ---- CHANGE THIS if your database URL is ever different ----
const FIREBASE_URL = "https://co2-monitor-49cbd-default-rtdb.firebaseio.com/";

function updateLive() {
  fetch(FIREBASE_URL + "live.json")
    .then(r => r.json())
    .then(d => {
      if (!d) return;
      document.getElementById('co2').innerText = d.co2 ?? '---';
      document.getElementById('rssi').innerText = d.rssi ?? '---';
      document.getElementById('date').innerText = d.date ?? '---';
      document.getElementById('time').innerText = d.time ?? '---';
      document.getElementById('recording').innerText = d.recording ?? '---';
      document.getElementById('count').innerText = d.count ?? '---';
    })
    .catch(err => console.error("Live fetch failed", err));
}

function loadRecords() {
  fetch(FIREBASE_URL + "records.json")
    .then(r => r.json())
    .then(data => {
      if (!data) {
        document.getElementById('records').innerHTML = "";
        return;
      }
      // data is an object keyed by timestamp - sort newest first
      const rows = Object.values(data).sort((a, b) => (a.date + a.time > b.date + b.time ? -1 : 1));
      let html = "";
      rows.forEach((r, index) => {
        html += `<tr><td>${index + 1}</td><td>${r.date}</td><td>${r.time}</td><td>${r.ppm}</td></tr>`;
      });
      document.getElementById('records').innerHTML = html;
    })
    .catch(err => console.error("Records fetch failed", err));
}

function sendCommand(cmd) {
  fetch(FIREBASE_URL + "command.json", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(cmd)
  }).catch(err => console.error("Command send failed", err));
}

setInterval(updateLive, 2000);
setInterval(loadRecords, 5000);

updateLive();
loadRecords();
</script>

</body>
</html>
